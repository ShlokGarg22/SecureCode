rules:
  - id: generic-hardcoded-aws-key
    languages: [generic]
    message: "Hardcoded AWS Access Key ID detected."
    severity: ERROR
    metadata:
      category: hardcoded-secret
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: "Store AWS credentials in environment variables or an IAM instance role / AWS Secrets Manager."
      confidence: HIGH
    patterns:
      - pattern-regex: "(AKIA[0-9A-Z]{16})"

  - id: generic-hardcoded-api-key-assignment
    languages: [generic]
    message: "Potential hardcoded API secret or private token assignment."
    severity: WARNING
    metadata:
      category: hardcoded-secret
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      remediation: "Load sensitive tokens from environment variables or a secrets manager."
      confidence: MEDIUM
    patterns:
      - pattern-regex: '(?i)(api[_-]?key|secret[_-]?key|private[_-]?key|access[_-]?token)\s*[:=]\s*["''][A-Za-z0-9_\-\.]{16,}["'']'
